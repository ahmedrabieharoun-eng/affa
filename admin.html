<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم الشاملة</title>
  <script type="module">
    // استيراد مكتبات Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, getUsers } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    import { getStorage, ref, listAll } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-storage.js";

    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
      apiKey: "AIzaSyAFBsqYvPsQAPrnWvBfIIn0xKbQD8eFfFY",
      authDomain: "ton-up-422b5.firebaseapp.com",
      projectId: "ton-up-422b5",
      storageBucket: "ton-up-422b5.firebasestorage.app",
      messagingSenderId: "1097862104173",
      appId: "1:1097862104173:web:752c30106f7e9fc553ab64",
      measurementId: "G-R5YGH5QY0W"
    };

    // تهيئة Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const storage = getStorage(app);

    // دالة لجلب المستخدمين
    async function loadUsers() {
      const userTableBody = document.getElementById("usersTableBody");
      userTableBody.innerHTML = "<tr><td colspan='3'>جاري التحميل...</td></tr>";

      const users = await getUsers(auth);
      userTableBody.innerHTML = ""; // مسح الجدول

      users.forEach((user) => {
        const row = `
          <tr>
            <td>${user.displayName || "بدون اسم"}</td>
            <td>${user.email || "بدون بريد"}</td>
            <td>${user.uid}</td>
          </tr>`;
        userTableBody.insertAdjacentHTML("beforeend", row);
      });

      if (users.length === 0) {
        userTableBody.innerHTML = "<tr><td colspan='3'>لا يوجد مستخدمون بعد.</td></tr>";
      }
    }

    // دالة لجلب البيانات من Firestore
    async function loadData() {
      const dataTableBody = document.getElementById("dataTableBody");
      dataTableBody.innerHTML = "<tr><td colspan='3'>جاري التحميل...</td></tr>";

      const querySnapshot = await getDocs(collection(db, "data"));
      dataTableBody.innerHTML = ""; // مسح الجدول

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const row = `
          <tr>
            <td>${data.name || "بدون اسم"}</td>
            <td>${data.description || "بدون وصف"}</td>
            <td>${doc.id}</td>
          </tr>`;
        dataTableBody.insertAdjacentHTML("beforeend", row);
      });

      if (querySnapshot.empty) {
        dataTableBody.innerHTML = "<tr><td colspan='3'>لا توجد بيانات بعد.</td></tr>";
      }
    }

    // دالة لجلب الملفات من Firebase Storage
    async function loadFiles() {
      const filesTableBody = document.getElementById("filesTableBody");
      filesTableBody.innerHTML = "<tr><td colspan='2'>جاري التحميل...</td></tr>";

      const storageRef = ref(storage, 'files/'); // اختيار مجلد الملفات
      const fileList = await listAll(storageRef);
      filesTableBody.innerHTML = ""; // مسح الجدول

      fileList.items.forEach((fileRef) => {
        const fileName = fileRef.name;
        const fileRow = `
          <tr>
            <td><a href="${await getDownloadURL(fileRef)}" target="_blank">${fileName}</a></td>
            <td>${fileRef.fullPath}</td>
          </tr>`;
        filesTableBody.insertAdjacentHTML("beforeend", fileRow);
      });

      if (fileList.items.length === 0) {
        filesTableBody.innerHTML = "<tr><td colspan='2'>لا توجد ملفات بعد.</td></tr>";
      }
    }

    window.addEventListener("load", () => {
      loadUsers();
      loadData();
      loadFiles();
    });
  </script>

  <style>
    body {
      font-family: "Tajawal", sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }
    header {
      background: #3498db;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    .container {
      width: 90%;
      margin: 20px auto;
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      color: #333;
      text-align: right;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background: #2980b9;
      color: white;
    }
  </style>
</head>
<body>
  <header>لوحة التحكم الشاملة</header>

  <div class="container">
    <h2>المستخدمين</h2>
    <table>
      <thead>
        <tr>
          <th>الاسم</th>
          <th>البريد الإلكتروني</th>
          <th>ID</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
        <tr><td colspan="3">جاري التحميل...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="container">
    <h2>البيانات (Firestore)</h2>
    <table>
      <thead>
        <tr>
          <th>الاسم</th>
          <th>الوصف</th>
          <th>ID</th>
        </tr>
      </thead>
      <tbody id="dataTableBody">
        <tr><td colspan="3">جاري التحميل...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="container">
    <h2>الملفات (Storage)</h2>
    <table>
      <thead>
        <tr>
          <th>الملف</th>
          <th>المسار</th>
        </tr>
      </thead>
      <tbody id="filesTableBody">
        <tr><td colspan="2">جاري التحميل...</td></tr>
      </tbody>
    </table>
  </div>

</body>
</html>
