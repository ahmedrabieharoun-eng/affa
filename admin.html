<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore.js"></script>
</head>
<body>
    <h1>Admin Dashboard</h1>
    <div id="users-list"></div>

    <script>
        // Firebase initialization
        const firebaseConfig = {
            apiKey: "AIzaSyAFBsqYvPsQAPrnWvBfIIn0xKbQD8eFfFY",
            authDomain: "ton-up-422b5.firebaseapp.com",
            projectId: "ton-up-422b5",
            storageBucket: "ton-up-422b5.firebasestorage.app",
            messagingSenderId: "1097862104173",
            appId: "1:1097862104173:web:752c30106f7e9fc553ab64",
            measurementId: "G-R5YGH5QY0W"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Fetch users from Firestore
        db.collection("users").get().then((snapshot) => {
            snapshot.forEach(doc => {
                const userData = doc.data();
                const userDiv = document.createElement('div');
                userDiv.innerHTML = `${userData.name} - ${userData.email}`;
                document.getElementById('users-list').appendChild(userDiv);
            });
        });
    </script>
</body>
</html>
