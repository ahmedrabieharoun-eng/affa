<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crystal Ranch</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --primary: #FF5CA8; --pink-glow: rgba(255,92,168,0.4);
            --green: #00F27A; --green-glow: rgba(0,242,122,0.4);
            --blue: #00D4FF; --blue-glow: rgba(0,212,255,0.4);
            --gold: #FFD700; --danger: #FF4B5C;
            --bg: url('https://i.ibb.co/kVGZmG6x/Chat-GPT-Image-15-2026-06-52-13.png');
            --glass: rgba(20,25,35,0.55); --glass-strong: rgba(25,30,40,0.85);
            --border: rgba(255,255,255,0.08); --text: #fff; --text-sec: rgba(255,255,255,0.85);
            --text-muted: rgba(255,255,255,0.5);
        }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg) center/cover fixed;
            color: var(--text); min-height: 100vh; padding-bottom: 90px; font-size: 12px;
            position: relative; overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background: rgba(10,10,25,0.25); backdrop-filter: blur(2px); z-index: -1;
        }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
        @keyframes pulse { 0%,100%{box-shadow:0 0 10px var(--pink-glow)} 50%{box-shadow:0 0 25px var(--pink-glow)} }
        @keyframes fade-in { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .float { animation: float 3s infinite ease-in-out; }
        .pulse { animation: pulse 2s infinite ease-in-out; }
        .container { max-width: 500px; margin: 0 auto; padding: 12px; }
        .glass { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 20px; }
        .status-bar {
            background: var(--glass-strong); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); padding: 10px 12px; position: sticky; top: 0; z-index: 100;
        }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
        .status-card { background: var(--glass); border: 1px solid var(--border); border-radius: 16px; padding: 6px 4px; }
        .flex { display: flex; align-items: center; gap: 8px; }
        .flex-between { display: flex; align-items: center; justify-content: space-between; }
        .btn {
            border: none; border-radius: 14px; padding: 10px; font-weight: 600; font-size: 12px;
            display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
            transition: all 0.15s; font-family: 'Inter', sans-serif; width: 100%;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: linear-gradient(145deg, var(--primary), #D94A8F); color: white; box-shadow: 0 4px 12px var(--pink-glow); }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--glass-strong);
            backdrop-filter: blur(20px); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding: 8px 4px; z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-sec); cursor: pointer; padding: 5px 6px; border-radius: 14px; }
        .nav-item.active { color: var(--primary); background: rgba(255,92,168,0.1); }
        .section { display: none; animation: fade-in 0.3s ease; }
        .section.active { display: block; }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; visibility: hidden; transition: all 0.2s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: var(--glass-strong); border: 1px solid var(--border); border-radius: 24px; padding: 18px; width: 90%; max-width: 360px; animation: fade-in 0.3s ease; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        (function() {
            // ========== CONFIG ==========
            const CONFIG = {
                API_URL: 'https://noisy-dust-b9e8.mmrr2872008.workers.dev',
                BOT_USERNAME: '@Crystal_Ranch_bot',
                DEPOSIT_WALLET: 'UQAzGsppYQfQwVnVVQDt2Jq9r4cm7fO3iVuLCxv30FixJq1-',
                CRYSTAL_PRICE: 25, TASK_REWARD: 0.001, MAX_ACTIVE_ORDERS: 2,
                COW_LEVELS: {1:{prod:500,act:200,up:6000},2:{prod:1000,act:350,up:20000},3:{prod:2500,act:1200,up:0}},
                STORAGE_LEVELS: {1:{cap:2000,cost:0},2:{cap:5000,cost:2000},3:{cap:10000,cost:5000},4:{cap:20000,cost:10000},5:{cap:40000,cost:20000},6:{cap:80000,cost:40000},7:{cap:160000,cost:80000},8:{cap:320000,cost:160000},9:{cap:640000,cost:320000},10:{cap:1000000,cost:600000}}
            };

            // ========== TRANSLATIONS ==========
            const T = { en: {
                'nav.farm':'Farm','nav.market':'Market','nav.crystal':'Crystal','nav.friends':'Friends','nav.tasks':'Tasks','nav.profile':'Profile',
                'status.milk':'MILK','status.eggs':'EGGS','status.crystal':'CRYSTAL','status.deposit':'Deposit',
                'farm.cow.name':'Cow','farm.chicken.name':'Chicken','farm.crystal.name':'Crystal Engine','farm.buy':'Buy Multiple','farm.hatch':'Hatch',
                'market.title':'P2P Market','market.buy':'Buy','market.myOrders':'My Orders','market.createSell':'Create Sell Order',
                'crystal.title':'Crystal Conversion','crystal.convert':'Convert',
                'referral.title':'Referral Program','referral.claim':'Claim Earnings',
                'tasks.title':'Tasks & Rewards','tasks.addTask':'Add Task','tasks.verify':'Verify',
                'profile.withdraw':'Withdraw TON','profile.withdrawBtn':'Withdraw'
            }, ru: {
                'nav.farm':'Ферма','nav.market':'Рынок','nav.crystal':'Кристалл','nav.friends':'Друзья','nav.tasks':'Задания','nav.profile':'Профиль',
                'status.milk':'МОЛОКО','status.eggs':'ЯЙЦА','status.crystal':'КРИСТАЛЛ','status.deposit':'Депозит',
                'farm.cow.name':'Корова','farm.chicken.name':'Курица','farm.crystal.name':'Кристальный двигатель','farm.buy':'Купить несколько','farm.hatch':'Вывести',
                'market.title':'P2P Рынок','market.buy':'Купить','market.myOrders':'Мои заказы','market.createSell':'Создать ордер',
                'crystal.title':'Конвертация кристаллов','crystal.convert':'Конвертировать',
                'referral.title':'Реферальная программа','referral.claim':'Забрать доход',
                'tasks.title':'Задания и награды','tasks.addTask':'Добавить задание','tasks.verify':'Проверить',
                'profile.withdraw':'Вывести TON','profile.withdrawBtn':'Вывести'
            }};

            // ========== STATE ==========
            const App = {
                user: null, global: null, lang: 'en', userId: null, telegram: null, tonConnectUI: null,
                ranch: { cowLevels: {1:0,2:0,3:0}, cowActive: {1:0,2:0,3:0}, milkStored: 0, storageLevel: 1, storageCapacity: 2000 },
                currentMarketResource: 'milk', currentTaskTab: 'partner',
                timers: {}, lastClick: {}
            };

            // ========== UTILS ==========
            const $ = id => document.getElementById(id);
            const formatNum = n => n>=1e6?(n/1e6).toFixed(2)+'M': n>=1e3?(n/1e3).toFixed(1)+'K': n?.toLocaleString()||'0';
            const formatTON = n => n?.toFixed(4) || '0';
            const showNotif = (msg, type='success') => {
                const n = document.createElement('div');
                n.className = `notification ${type}`; n.innerHTML = msg;
                $('notificationContainer')?.appendChild(n);
                setTimeout(() => { n.classList.add('fade-out'); setTimeout(() => n.remove(), 300); }, 5000);
            };
            const checkCooldown = (id, btn) => {
                const now = Date.now(), last = App.lastClick[id]||0;
                if (now-last < 10000) { showNotif(App.lang=='ru'?`⏳ انتظر ${Math.ceil((10000-now+last)/1000)} ثانية`:'⏳ Please wait', 'warning'); return false; }
                App.lastClick[id]=now; if(btn) btn.disabled=true; return true;
            };

            // ========== API ==========
            const callAPI = async (action, data={}) => {
                const res = await fetch(`${CONFIG.API_URL}/api`, {
                    method: 'POST', headers: {
                        'Content-Type':'application/json', 'X-Action':action, 'X-CSRF-Token':'crystal-ranch-secure-token-2026',
                        ...(App.telegram?.initData && {'Authorization':`Telegram ${App.telegram.initData}`})
                    }, body: JSON.stringify({action, data})
                });
                const result = await res.json();
                if(!result.success) throw new Error(result.error);
                return result.data;
            };

            // ========== UI UPDATE ==========
            const updateUI = async () => {
                if(!App.user || !App.global) return;
                const u=App.user, g=App.global;
                $('statusMilk').innerHTML = formatNum(u.milk);
                $('statusEggs').innerHTML = formatNum(u.eggs);
                $('statusDiamond').innerHTML = formatNum(u.diamond);
                $('statusTon').innerHTML = formatTON(u.tonBalance);
                $('milkPerHour').innerHTML = u.milkPerHour||0;
                $('eggsPerHour').innerHTML = u.eggsPerHour||0;
                $('cowsOwned').innerHTML = u.cows_owned||0;
                $('cowProgressText').innerHTML = `${g.cows_sold||0}/${g.cows_cap}`;
                $('cowProgressFill').style.width = `${g.cows_progress||0}%`;
                $('chickensOwned').innerHTML = u.chickens_owned||0;
                $('diamondEnginesOwned').innerHTML = u.diamond_engines_owned||0;
                
                // تحديث الأزرار
                const cowBtn = $('buyCowBtn');
                if(g.cows_remaining<=0) {
                    cowBtn.disabled = true; cowBtn.innerHTML = '<i class="fas fa-ban"></i> '+(App.lang=='ru'?'Продано':'Sold Out');
                } else {
                    cowBtn.disabled = false; cowBtn.innerHTML = '<i class="fas fa-shopping-cart"></i> '+(App.lang=='ru'?'Купить несколько':'Buy Multiple');
                }
                
                // تحديث الرصيد في كل مكان
                $('profileMilk').innerHTML = formatNum(u.milk);
                $('profileEggs').innerHTML = formatNum(u.eggs);
                $('profileDiamond').innerHTML = formatNum(u.diamond);
                $('profileTon').innerHTML = formatTON(u.tonBalance);
            };

            // ========== RENDER ==========
            const render = () => {
                document.getElementById('app').innerHTML = `
                <div class="notification-container" id="notificationContainer"></div>
                <div class="status-bar">
                    <div class="grid-3">
                        <div class="status-card"><div class="flex"><span>🥛</span><span data-i18n="status.milk">MILK</span></div><div id="statusMilk">0</div></div>
                        <div class="status-card"><div class="flex"><span>🥚</span><span data-i18n="status.eggs">EGGS</span></div><div id="statusEggs">0</div></div>
                        <div class="status-card"><div class="flex"><span>💎</span><span data-i18n="status.crystal">CRYSTAL</span></div><div id="statusDiamond">0</div></div>
                    </div>
                    <div class="flex-between">
                        <div class="flex"><img src="https://i.ibb.co/WNfvBK9h/toncoin-1.webp" style="width:18px"><span id="statusTon">0.0000</span> TON</div>
                        <div class="flex"><i class="fas fa-clock"></i><span id="productionTimer">00:00</span></div>
                        <div class="flex">
                            <button class="lang-btn" data-lang="en">EN</button>
                            <button class="lang-btn" data-lang="ru">RU</button>
                        </div>
                        <button class="btn btn-primary" id="depositButton" style="width:auto;padding:6px 14px"><i class="fas fa-plus-circle"></i> <span data-i18n="status.deposit">Deposit</span></button>
                    </div>
                </div>
                <div class="container">
                    ${renderSections()}
                </div>
                <nav class="bottom-nav">
                    ${['farm','market','crystal','friends','tasks','profile'].map(s=>`
                        <div class="nav-item" data-section="section${s.charAt(0).toUpperCase()+s.slice(1)}">
                            <div class="nav-icon">${s=='farm'?'🚜':s=='market'?'📊':s=='crystal'?'💎':s=='friends'?'👥':s=='tasks'?'✅':'👤'}</div>
                            <div class="nav-text" data-i18n="nav.${s}">${s}</div>
                        </div>
                    `).join('')}
                </nav>
                ${renderModals()}
                `;
                initEventListeners();
                loadGameState();
            };

            const renderSections = () => `
                <div id="sectionFarm" class="section active">${renderFarm()}</div>
                <div id="sectionMarket" class="section">${renderMarket()}</div>
                <div id="sectionCrystal" class="section">${renderCrystal()}</div>
                <div id="sectionFriends" class="section">${renderFriends()}</div>
                <div id="sectionTasks" class="section">${renderTasks()}</div>
                <div id="sectionProfile" class="section">${renderProfile()}</div>
            `;

            const renderFarm = () => `
                <div class="glass p-3">
                    <div class="grid-2">
                        <div class="glass p-2">
                            <div class="flex"><img src="https://i.ibb.co/j9zxzsQB/photo-5807836880429583588-m.jpg" style="width:40px;height:40px;border-radius:12px"><div><div data-i18n="farm.cow.name">Cow</div><small>1 TON</small></div></div>
                            <div class="flex-between mt-2"><span data-i18n="farm.owned">Owned</span><span id="cowsOwned">0</span></div>
                            <div class="progress-bar mt-2"><div class="progress-fill" id="cowProgressFill" style="width:0%"></div></div>
                            <div class="flex-between mt-2"><button class="btn btn-primary" id="buyCowBtn"><i class="fas fa-shopping-cart"></i> <span data-i18n="farm.buy">Buy Multiple</span></button><button class="btn" id="hatchCowBtn"><i class="fas fa-egg"></i> <span data-i18n="farm.hatch">Hatch</span></button></div>
                        </div>
                        <div class="glass p-2">
                            <div class="flex"><img src="https://i.ibb.co/23cXtGD1/photo-5807836880429583589-m.jpg" style="width:40px;height:40px;border-radius:12px"><div><div data-i18n="farm.chicken.name">Chicken</div><small>1 TON</small></div></div>
                            <div class="flex-between mt-2"><span data-i18n="farm.owned">Owned</span><span id="chickensOwned">0</span></div>
                            <div class="progress-bar mt-2"><div class="progress-fill" id="chickenProgressFill" style="width:0%"></div></div>
                            <div class="flex-between mt-2"><button class="btn" id="buyChickenBtn" disabled><i class="fas fa-lock"></i> <span data-i18n="farm.buy">Buy</span></button><button class="btn" id="hatchChickenBtn"><i class="fas fa-egg"></i> <span data-i18n="farm.hatch">Hatch</span></button></div>
                        </div>
                    </div>
                    <div class="glass mt-2 p-2">
                        <div class="flex"><img src="https://i.ibb.co/JFb1bY8K/photo-5807836880429583587-m.jpg" style="width:40px;height:40px;border-radius:12px"><div><div data-i18n="farm.crystal.name">Crystal Engine</div><small>20 TON</small></div></div>
                        <div class="flex-between mt-2"><span data-i18n="farm.owned">Owned</span><span id="diamondEnginesOwned">0</span></div>
                        <div class="flex-between mt-2"><button class="btn btn-primary" id="buyDiamondBtn" disabled><i class="fas fa-lock"></i> <span data-i18n="farm.buy">Buy</span></button><button class="btn" id="startDiamondBtn" disabled><i class="fas fa-play"></i> <span data-i18n="farm.start">Start</span></button></div>
                    </div>
                </div>
            `;

            const renderMarket = () => `
                <div class="glass p-3">
                    <div class="flex-between"><span data-i18n="market.title">P2P Market</span><button class="btn" id="refreshMarketBtn"><i class="fas fa-sync-alt"></i></button></div>
                    <div class="flex-between mt-2">
                        <div class="flex"><span class="market-tab active" data-market-tab="buy" data-i18n="market.buy">Buy</span><span class="market-tab" data-market-tab="orders" data-i18n="market.myOrders">My Orders</span></div>
                        <button class="btn btn-primary" id="createSellOrderBtnTop" style="width:auto"><i class="fas fa-plus-circle"></i> <span data-i18n="market.createSell">Sell</span></button>
                    </div>
                    <div id="marketBuyView">
                        <div class="grid-2" id="sellOrdersGrid"></div>
                    </div>
                    <div id="marketMyOrdersView" style="display:none">
                        <h3 data-i18n="market.activeOrders">Active Orders</h3>
                        <div class="grid-2" id="myActiveOrders"></div>
                        <h3 class="mt-2" data-i18n="market.history">History</h3>
                        <div id="myFilledOrders"></div>
                    </div>
                </div>
            `;

            const renderCrystal = () => `
                <div class="glass p-3 text-center">
                    <div class="diamond-glow">💎</div>
                    <div id="crystalPriceMain">${CONFIG.CRYSTAL_PRICE}</div>
                    <small data-i18n="crystal.perTon">TON per Crystal</small>
                    <div class="flex-between mt-2">
                        <div><small data-i18n="crystal.yourCrystals">Your Crystals</small><div id="diamondBalanceMain">0</div></div>
                        <div>→</div>
                        <div><small data-i18n="crystal.youReceive">You Receive</small><div id="tonReceiveMain">0</div></div>
                    </div>
                    <div class="flex mt-2">
                        <input type="number" id="convertAmount" class="form-input" placeholder="Amount">
                        <button class="btn btn-primary" id="convertDiamondBtn" data-i18n="crystal.convert">Convert</button>
                    </div>
                </div>
            `;

            const renderFriends = () => `
                <div class="glass p-3">
                    <div data-i18n="referral.title">Referral Program</div>
                    <div class="glass mt-2 p-2">
                        <div data-i18n="referral.description">Earn 10% commission</div>
                        <div class="flex mt-2"><input type="text" id="referralLink" class="form-input" readonly><button class="btn" id="copyReferralBtn"><i class="fas fa-copy"></i></button></div>
                    </div>
                    <button class="btn btn-primary mt-2" id="claimReferralBtn" data-i18n="referral.claim">Claim Earnings</button>
                    <div class="mt-2"><span data-i18n="referral.recent">Recent Referrals</span> (<span id="totalReferrals">0</span>)</div>
                    <div id="recentReferralsList"></div>
                </div>
            `;

            const renderTasks = () => `
                <div class="glass p-3">
                    <div class="flex-between">
                        <span data-i18n="tasks.title">Tasks & Rewards</span>
                        <button class="btn" id="addTaskBtn"><i class="fas fa-plus-circle"></i> <span data-i18n="tasks.addTask">Add Task</span></button>
                    </div>
                    <div class="flex mt-2">
                        <span class="market-tab active" data-task-tab="partner" data-i18n="tasks.partner">Partner</span>
                        <span class="market-tab" data-task-tab="community" data-i18n="tasks.community">Community</span>
                    </div>
                    <div id="tasksGrid" class="task-grid"></div>
                </div>
            `;

            const renderProfile = () => `
                <div class="glass p-3">
                    <div class="flex">
                        <div class="avatar" id="profileAvatar">👨‍🌾</div>
                        <div><div id="profileName">Farmer</div><div id="profileUsername">@crystal_ranch</div></div>
                    </div>
                    <div class="grid-2 mt-2">
                        <div class="glass p-2"><small data-i18n="profile.totalMachines">Total Machines</small><div id="totalMachines">0</div></div>
                        <div class="glass p-2"><small data-i18n="profile.production">Production</small><div id="totalProduction">0/h</div></div>
                    </div>
                    <div class="mt-2">
                        <div class="flex-between"><span>🥛</span><span id="profileMilk">0</span></div>
                        <div class="flex-between"><span>🥚</span><span id="profileEggs">0</span></div>
                        <div class="flex-between"><span>💎</span><span id="profileDiamond">0</span></div>
                        <div class="flex-between"><img src="https://i.ibb.co/WNfvBK9h/toncoin-1.webp" style="width:16px"><span id="profileTon">0.0000</span></div>
                    </div>
                    <div class="mt-2">
                        <input type="number" id="withdrawAmount" class="form-input" placeholder="0.1">
                        <input type="text" id="withdrawAddress" class="form-input mt-1" placeholder="EQD...">
                        <button class="btn btn-primary mt-2" id="withdrawBtn" data-i18n="profile.withdrawBtn">Withdraw</button>
                    </div>
                </div>
            `;

            const renderModals = () => `
                <div class="modal-overlay" id="sellOrderModal">${renderSellModal()}</div>
                <div class="modal-overlay" id="hatchModal">${renderHatchModal()}</div>
                <div class="modal-overlay" id="depositModal">${renderDepositModal()}</div>
                <div class="modal-overlay" id="addTaskModal">${renderAddTaskModal()}</div>
            `;

            const renderSellModal = () => `
                <div class="modal-content">
                    <div class="flex-between"><h3 data-i18n="modal.sell.title">Sell Order</h3><i class="fas fa-times modal-close" onclick="closeAllModals()"></i></div>
                    <div class="flex"><label><input type="radio" name="sellResource" value="milk" checked> 🥛 Milk</label><label><input type="radio" name="sellResource" value="eggs"> 🥚 Eggs</label></div>
                    <input type="number" id="sellQuantity" class="form-input mt-2" placeholder="Quantity" min="100">
                    <input type="number" id="sellTotalPrice" class="form-input mt-2" placeholder="Total Price (TON)">
                    <button class="btn btn-primary mt-2" id="submitSellOrderBtn" data-i18n="modal.sell.place">Place Sell Order</button>
                </div>
            `;

            const renderHatchModal = () => `
                <div class="modal-content">
                    <div class="flex-between"><h3 data-i18n="modal.hatch.title">Hatch Machine</h3><i class="fas fa-times modal-close" onclick="closeAllModals()"></i></div>
                    <div class="glass p-2 mt-2"><div class="flex-between"><span>🐮 Cow</span><span>50k 🥛</span></div><div class="flex"><input type="number" id="hatchCowAmount" class="form-input" value="1" min="1"><button class="btn" id="hatchCowConfirm">Hatch</button></div></div>
                    <div class="glass p-2 mt-2"><div class="flex-between"><span>🐔 Chicken</span><span>5k 🥚</span></div><div class="flex"><input type="number" id="hatchChickenAmount" class="form-input" value="1" min="1"><button class="btn" id="hatchChickenConfirm">Hatch</button></div></div>
                </div>
            `;

            const renderDepositModal = () => `
                <div class="modal-content">
                    <div class="flex-between"><h3 data-i18n="modal.deposit.title">Deposit TON</h3><i class="fas fa-times modal-close" onclick="closeAllModals()"></i></div>
                    <div class="flex-between"><span id="walletAddressDisplay">Not connected</span><button class="btn" id="connectWalletBtn">Connect</button></div>
                    <input type="number" id="depositAmountInput" class="form-input mt-2" placeholder="Amount" step="0.1" min="0.1">
                    <button class="btn btn-primary mt-2" id="submitDepositBtn" disabled>Deposit</button>
                </div>
            `;

            const renderAddTaskModal = () => `
                <div class="modal-content">
                    <div class="flex-between"><h3 data-i18n="tasks.addTask">Add Task</h3><i class="fas fa-times modal-close" onclick="closeAllModals()"></i></div>
                    <div class="flex"><label><input type="radio" name="taskType" value="channel" checked> 📢 Channel</label><label><input type="radio" name="taskType" value="bot"> 🤖 Bot</label></div>
                    <input type="text" id="taskLink" class="form-input mt-2" placeholder="https://t.me/...">
                    <input type="number" id="taskTarget" class="form-input mt-2" placeholder="Target users (min 100)" value="100" min="100">
                    <div id="taskTotalCost" class="mt-2">Total Cost: 0 TON</div>
                    <button class="btn btn-primary mt-2" id="submitTaskBtn">Confirm & Pay</button>
                </div>
            `;

            // ========== EVENT LISTENERS ==========
            const initEventListeners = () => {
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.addEventListener('click', () => {
                        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                        $(item.dataset.section).classList.add('active');
                        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                        item.classList.add('active');
                    });
                });

                document.querySelectorAll('.lang-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        App.lang = btn.dataset.lang;
                        document.querySelectorAll('[data-i18n]').forEach(el => {
                            const key = el.dataset.i18n;
                            if(T[App.lang][key]) el.textContent = T[App.lang][key];
                        });
                    });
                });

                $('depositButton').addEventListener('click', () => $('depositModal').classList.add('active'));
                $('connectWalletBtn').addEventListener('click', connectWallet);
                $('submitDepositBtn').addEventListener('click', initiateDeposit);
                $('buyCowBtn').addEventListener('click', buyCow);
                $('hatchCowBtn').addEventListener('click', () => $('hatchModal').classList.add('active'));
                $('hatchChickenBtn').addEventListener('click', () => $('hatchModal').classList.add('active'));
                $('hatchCowConfirm').addEventListener('click', hatchCow);
                $('hatchChickenConfirm').addEventListener('click', hatchChicken);
                $('convertDiamondBtn').addEventListener('click', convertDiamond);
                $('copyReferralBtn').addEventListener('click', copyReferral);
                $('claimReferralBtn').addEventListener('click', claimReferral);
                $('withdrawBtn').addEventListener('click', withdraw);
                $('createSellOrderBtnTop').addEventListener('click', () => $('sellOrderModal').classList.add('active'));
                $('submitSellOrderBtn').addEventListener('click', createSellOrder);
                $('addTaskBtn').addEventListener('click', () => $('addTaskModal').classList.add('active'));
                $('submitTaskBtn').addEventListener('click', createTask);
                $('refreshMarketBtn').addEventListener('click', () => loadMarketOrders());

                document.querySelectorAll('[data-market-tab]').forEach(tab => {
                    tab.addEventListener('click', function() {
                        document.querySelectorAll('[data-market-tab]').forEach(t => t.classList.remove('active'));
                        this.classList.add('active');
                        $('marketBuyView').style.display = this.dataset.marketTab === 'buy' ? 'block' : 'none';
                        $('marketMyOrdersView').style.display = this.dataset.marketTab === 'orders' ? 'block' : 'none';
                        if(this.dataset.marketTab === 'orders') loadMyOrders();
                    });
                });

                document.querySelectorAll('[data-task-tab]').forEach(tab => {
                    tab.addEventListener('click', function() {
                        document.querySelectorAll('[data-task-tab]').forEach(t => t.classList.remove('active'));
                        this.classList.add('active');
                        App.currentTaskTab = this.dataset.taskTab;
                        loadTasks();
                    });
                });

                document.querySelectorAll('.modal-close, .modal-overlay').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if(e.target === this || this.classList.contains('modal-close')) {
                            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
                        }
                    });
                });
            };

            // ========== BUSINESS LOGIC ==========
            const loadGameState = async () => {
                try {
                    const state = await callAPI('getState');
                    App.user = state.user;
                    App.global = state.global;
                    if(state.ranch) App.ranch = state.ranch;
                    if(state.referral) App.referral = state.referral;
                    updateUI();
                    if($('sectionMarket').classList.contains('active')) loadMarketOrders();
                    if($('sectionTasks').classList.contains('active')) loadTasks();
                    if($('sectionFriends').classList.contains('active')) loadReferrals();
                } catch(e) { console.error('Load state error:', e); }
            };

            const loadMarketOrders = async () => {
                try {
                    const orders = await callAPI('getMarketOrders', {resource:App.currentMarketResource, type:'sell', page:1, limit:10});
                    const html = orders.orders?.map(o => `
                        <div class="glass p-2" onclick="buyOrder('${o.id}',${o.remaining},${o.pricePerUnit})">
                            <div class="flex-between"><span>${o.resource==='milk'?'🥛':'🥚'} ${formatNum(o.remaining)}</span><span>${formatTON(o.remaining*o.pricePerUnit)} TON</span></div>
                            <small>${formatTON(o.pricePerUnit)} TON/unit</small>
                        </div>
                    `).join('') || '<div class="text-center p-3">No orders</div>';
                    $('sellOrdersGrid').innerHTML = html;
                } catch(e) { console.error(e); }
            };

            const loadMyOrders = async () => {
                try {
                    const orders = await callAPI('getMyOrders');
                    $('myActiveOrders').innerHTML = orders.active?.map(o => `
                        <div class="glass p-2">
                            <div class="flex-between"><span>${o.resource==='milk'?'🥛':'🥚'} ${formatNum(o.remaining)}/${formatNum(o.quantity)}</span><span>${formatTON(o.remaining*o.pricePerUnit)} TON</span></div>
                            <button class="btn btn-secondary mt-1" onclick="cancelOrder('${o.id}')">Cancel</button>
                        </div>
                    `).join('') || '<div class="text-center p-2">No active orders</div>';
                } catch(e) { console.error(e); }
            };

            const loadTasks = async () => {
                try {
                    const tasks = await callAPI('getTasks', {type:App.currentTaskTab});
                    $('tasksGrid').innerHTML = tasks.map(t => `
                        <div class="glass p-2">
                            <div class="flex-between"><span>${t.type==='channel'?'📢':'🤖'} ${t.name||t.type}</span><span>${formatTON(t.reward||CONFIG.TASK_REWARD)} TON</span></div>
                            <button class="btn btn-primary mt-1" onclick="verifyTask('${t.id}')">Verify</button>
                        </div>
                    `).join('') || '<div class="text-center p-3">No tasks</div>';
                } catch(e) { console.error(e); }
            };

            const loadReferrals = async () => {
                try {
                    const ref = await callAPI('getReferrals');
                    App.referral = ref;
                    $('totalReferrals').innerHTML = ref.totalReferrals||0;
                    $('recentReferralsList').innerHTML = ref.recentReferrals?.map(r => `
                        <div class="flex-between p-1">${r.firstName||'User'} <span class="text-green">+${formatTON(r.earned||0)} TON</span></div>
                    `).join('') || '<div class="text-center p-2">No referrals</div>';
                } catch(e) { console.error(e); }
            };

            // ========== ACTIONS ==========
            window.buyCow = async () => {
                if(!checkCooldown('buyCow', $('buyCowBtn'))) return;
                const qty = prompt(App.lang=='ru'?'كم عدد الأبقار؟':'How many cows?', '1');
                if(!qty) return;
                try {
                    await callAPI('buyCow', {quantity:parseInt(qty)});
                    await loadGameState();
                    showNotif('✅ '+(App.lang=='ru'?'تم الشراء':'Purchased'));
                } catch(e) { showNotif(e.message, 'error'); }
            };

            window.hatchCow = async () => {
                const amt = parseInt($('hatchCowAmount')?.value)||1;
                try { await callAPI('hatchCow', {amount:amt}); await loadGameState(); showNotif('✅ Hatched'); $('hatchModal').classList.remove('active'); } 
                catch(e) { showNotif(e.message, 'error'); }
            };

            window.hatchChicken = async () => {
                const amt = parseInt($('hatchChickenAmount')?.value)||1;
                try { await callAPI('hatchChicken', {amount:amt}); await loadGameState(); showNotif('✅ Hatched'); $('hatchModal').classList.remove('active'); } 
                catch(e) { showNotif(e.message, 'error'); }
            };

            window.convertDiamond = async () => {
                const amt = parseInt($('convertAmount')?.value);
                if(!amt) return;
                try { await callAPI('convertDiamond', {amount:amt}); await loadGameState(); showNotif('✅ Converted'); $('convertAmount').value=''; } 
                catch(e) { showNotif(e.message, 'error'); }
            };

            window.copyReferral = () => {
                $('referralLink').select();
                navigator.clipboard.writeText($('referralLink').value);
                showNotif('✅ '+(App.lang=='ru'?'تم النسخ':'Copied'));
            };

            window.claimReferral = async () => {
                try { await callAPI('claimReferralEarnings'); await loadGameState(); showNotif('✅ Claimed'); } 
                catch(e) { showNotif(e.message, 'error'); }
            };

            window.withdraw = async () => {
                const amt = parseFloat($('withdrawAmount')?.value);
                const addr = $('withdrawAddress')?.value;
                if(!amt || amt<0.1 || !addr) return;
                try { await callAPI('withdraw', {amount:amt, address:addr}); await loadGameState(); showNotif('✅ Withdrawal requested'); } 
                catch(e) { showNotif(e.message, 'error'); }
            };

            window.createSellOrder = async () => {
                const resource = document.querySelector('input[name="sellResource"]:checked')?.value;
                const qty = parseInt($('sellQuantity')?.value);
                const price = parseFloat($('sellTotalPrice')?.value);
                if(!resource || !qty || qty<100 || !price) return;
                try { await callAPI('createSellOrder', {resource, quantity:qty, pricePerUnit:price/qty}); showNotif('✅ Order created'); $('sellOrderModal').classList.remove('active'); loadMarketOrders(); } 
                catch(e) { showNotif(e.message, 'error'); }
            };

            window.createTask = async () => {
                const type = document.querySelector('input[name="taskType"]:checked')?.value;
                const link = $('taskLink')?.value;
                const target = parseInt($('taskTarget')?.value);
                if(!type || !link || !target || target<100) return;
                try { await callAPI('createTask', {type, link, targetUsers:target, reward:CONFIG.TASK_REWARD}); showNotif('✅ Task created'); $('addTaskModal').classList.remove('active'); loadTasks(); } 
                catch(e) { showNotif(e.message, 'error'); }
            };

            window.verifyTask = async (taskId) => {
                try { await callAPI('verifyTask', {taskId}); await loadGameState(); showNotif('✅ +'+CONFIG.TASK_REWARD+' TON'); loadTasks(); } 
                catch(e) { showNotif(e.message, 'error'); }
            };

            window.buyOrder = async (orderId, qty, price) => {
                if(!confirm(`Buy ${qty} for ${formatTON(qty*price)} TON?`)) return;
                try { await callAPI('executeOrder', {orderId, quantity:qty}); await loadGameState(); loadMarketOrders(); showNotif('✅ Purchased'); } 
                catch(e) { showNotif(e.message, 'error'); }
            };

            window.cancelOrder = async (orderId) => {
                try { await callAPI('cancelOrder', {orderId}); loadMyOrders(); showNotif('✅ Cancelled'); } 
                catch(e) { showNotif(e.message, 'error'); }
            };

            // ========== WALLET ==========
            const connectWallet = async () => {
                if(!App.tonConnectUI) App.tonConnectUI = new TON_CONNECT_UI.TonConnectUI({manifestUrl:CONFIG.API_URL+'/tonconnect-manifest.json'});
                await App.tonConnectUI.openModal();
                App.tonConnectUI.onStatusChange(wallet => {
                    if(wallet) {
                        App.wallet = wallet.account;
                        $('walletAddressDisplay').innerHTML = wallet.account.address.slice(0,6)+'...'+wallet.account.address.slice(-4);
                        $('connectWalletBtn').innerHTML = 'Disconnect';
                        $('submitDepositBtn').disabled = false;
                    } else {
                        App.wallet = null;
                        $('walletAddressDisplay').innerHTML = 'Not connected';
                        $('connectWalletBtn').innerHTML = 'Connect';
                        $('submitDepositBtn').disabled = true;
                    }
                });
            };

            const initiateDeposit = async () => {
                if(!App.wallet) return alert('Connect wallet first');
                const amt = parseFloat($('depositAmountInput')?.value);
                if(!amt || amt<0.1) return;
                try {
                    const tx = { validUntil: Math.floor(Date.now()/1000)+600, messages: [{address:CONFIG.DEPOSIT_WALLET, amount:String(Math.floor(amt*1e9)), payload:(await new TonWeb.boc.Cell().toBoc(false))}] };
                    await App.tonConnectUI.sendTransaction(tx);
                    showNotif('✅ Transaction sent');
                } catch(e) { showNotif(e.message, 'error'); }
            };

            // ========== INIT ==========
            const init = async () => {
                if(window.Telegram?.WebApp) {
                    App.telegram = Telegram.WebApp;
                    App.telegram.ready();
                    App.userId = App.telegram.initDataUnsafe?.user?.id || 'demo_'+Math.random();
                }
                render();
                await callAPI('initializeUser', {startParam:sessionStorage.getItem('referrer')});
                setInterval(loadGameState, 30000);
            };

            document.addEventListener('DOMContentLoaded', init);
            window.closeAllModals = () => document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
        })();
    </script>
</body>
</html>
